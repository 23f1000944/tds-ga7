name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: TDS identity: 23f1000944@ds.study.iitm.ac.in
        run: echo "Identity verified: 23f1000944@ds.study.iitm.ac.in"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run release gate tests
        run: python test_server.py
